# Server
server.port=8080
server.address=0.0.0.0

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USER:postgres.akpmrhikkgvhrcmqgkuf}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true

# Timezone (Vietnam UTC+7)
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
user.timezone=Asia/Ho_Chi_Minh

# JWT
jwt.secret=${JWT_SECRET:aDefaultSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth (optional - use placeholders if not configured)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:*,http://10.88.55.17:5173,https://*.vercel.app}

# OpenAI API. ChatGPT Plus does not include API usage.
app.ai.groq.api-key=${APP_GROQ_API_KEY:}
app.ai.groq.model=${APP_GROQ_MODEL:llama-3.1-8b-instant}
app.ai.groq.api-url=${APP_GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.transport=${MAIL_TRANSPORT:LOCAL}

# Optional VPS gateway for payout and email. When configured, sensitive provider
# credentials stay on the VPS and Railway signs each gateway request with HMAC.
sensitive.gateway.url=${SENSITIVE_GATEWAY_URL:}
sensitive.gateway.shared-secret=${SENSITIVE_GATEWAY_SHARED_SECRET:}

# Public URLs for hosted payment redirects/webhooks
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}

# Community post images (Cloudinary credentials must only be configured on the backend)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:thau-film/community}
spring.servlet.multipart.max-file-size=210MB
spring.servlet.multipart.max-request-size=211MB

# PayOS / VietQR
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Kênh chi PayOS/Bảo Kim có thể dùng bộ khóa riêng với kênh thu.
payos.payout.enabled=${PAYOS_PAYOUT_ENABLED:true}
payos.payout.client-id=${PAYOS_PAYOUT_CLIENT_ID:${PAYOS_CLIENT_ID:}}
payos.payout.api-key=${PAYOS_PAYOUT_API_KEY:${PAYOS_API_KEY:}}
payos.payout.checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:${PAYOS_CHECKSUM_KEY:}}

# Online movie streaming from S3. Store only object keys in DB; credentials stay in env vars.
app.streaming.s3.bucket=${STREAMING_S3_BUCKET:${AWS_S3_BUCKET:java-06}}
app.streaming.s3.region=${STREAMING_S3_REGION:${AWS_REGION:ap-southeast-1}}
app.streaming.s3.access-key=${STREAMING_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
app.streaming.s3.secret-key=${STREAMING_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
app.streaming.public-base-url=${STREAMING_PUBLIC_BASE_URL:https://java-06.s3.ap-southeast-1.amazonaws.com}
app.poster.url-ttl-seconds=${POSTER_URL_TTL_SECONDS:900}
app.streaming.url-ttl-seconds=${STREAMING_URL_TTL_SECONDS:300}

# Shared multipart uploads to S3. AWS credentials should come from environment variables.
app.file-upload.s3.bucket=${FILE_UPLOAD_S3_BUCKET:${STREAMING_S3_BUCKET:${AWS_S3_BUCKET:java-06}}}
app.file-upload.s3.region=${FILE_UPLOAD_S3_REGION:${STREAMING_S3_REGION:${AWS_REGION:ap-southeast-1}}}
app.file-upload.s3.access-key=${FILE_UPLOAD_S3_ACCESS_KEY:${STREAMING_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}}
app.file-upload.s3.secret-key=${FILE_UPLOAD_S3_SECRET_KEY:${STREAMING_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}}
app.file-upload.s3.public-base-url=${FILE_UPLOAD_S3_PUBLIC_BASE_URL:${STREAMING_PUBLIC_BASE_URL:}}

# Actuator for Railway health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.mail.enabled=false
refund.staff-approval-threshold=${REFUND_STAFF_APPROVAL_THRESHOLD:200000}
refund.window-hours=${REFUND_WINDOW_HOURS:3}
refund.status-poll-delay-ms=${REFUND_STATUS_POLL_DELAY_MS:60000}
refund.status-poll-initial-delay-ms=${REFUND_STATUS_POLL_INITIAL_DELAY_MS:30000}
