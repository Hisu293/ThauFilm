server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 211m;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Serve real static files normally. Extensionless paths belong to React
    # Router, even when a public asset directory happens to share the route
    # name (for example /login).
    location ~* \.(?:css|js|mjs|map|json|txt|xml|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|mp4|webm|m3u8|ts)$ {
        try_files $uri =404;
    }

    location / {
        try_files /index.html =404;
    }
}
