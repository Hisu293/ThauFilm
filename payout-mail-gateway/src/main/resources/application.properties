server.port=${SERVER_PORT:8090}
server.address=0.0.0.0
spring.application.name=thaufilm-payout-mail-gateway

gateway.shared-secret=${GATEWAY_SHARED_SECRET:}
gateway.auth.max-clock-skew-seconds=${GATEWAY_MAX_CLOCK_SKEW_SECONDS:300}

payos.payout.client-id=${PAYOS_PAYOUT_CLIENT_ID:}
payos.payout.api-key=${PAYOS_PAYOUT_API_KEY:}
payos.payout.checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
gateway.mail.from=${MAIL_FROM:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.servlet.multipart.max-request-size=15MB
