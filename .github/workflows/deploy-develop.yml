name: Deploy develop frontend to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thaufilm-develop-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Package and deploy frontend
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 30

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      ARCHIVE_NAME: thaufilm-${{ github.sha }}.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${EC2_HOST}"
          test -n "${EC2_USER}"
          [[ "${EC2_SSH_PORT}" =~ ^[0-9]+$ ]]
          (( EC2_SSH_PORT >= 1 && EC2_SSH_PORT <= 65535 ))

      - name: Create source ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_path="${RUNNER_TEMP}/${ARCHIVE_NAME}"
          git archive \
            --format=zip \
            --output="${archive_path}" \
            "${GITHUB_SHA}"

          if unzip -Z1 "${archive_path}" |
            grep -Eiq '(^|/)\.env($|\.)|(^|/).+\.(pem|key)$'; then
            echo "A secret file was found in the deployment archive." >&2
            exit 1
          fi

          unzip -t "${archive_path}" >/dev/null

      - name: Configure SSH
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${EC2_SSH_PRIVATE_KEY}"
          test -n "${EC2_KNOWN_HOSTS}"

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" |
            sed 's/\r$//' >"${HOME}/.ssh/ec2_deploy_key"
          printf '%s\n' "${EC2_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 0600 \
            "${HOME}/.ssh/ec2_deploy_key" \
            "${HOME}/.ssh/known_hosts"

          ssh-keygen -y -f "${HOME}/.ssh/ec2_deploy_key" >/dev/null

      - name: Upload source ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -P "${EC2_SSH_PORT}" \
            -i "${HOME}/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "${RUNNER_TEMP}/${ARCHIVE_NAME}" \
            "${EC2_USER}@${EC2_HOST}:/tmp/${ARCHIVE_NAME}"

      - name: Rebuild and restart frontend on EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "${EC2_SSH_PORT}" \
            -i "${HOME}/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s -- '${GITHUB_SHA}'" \
            < .github/scripts/deploy-ec2.sh
