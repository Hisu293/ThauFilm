name: Deploy develop changes to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thaufilm-develop-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Detect, package and deploy changed services
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 30

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      ARCHIVE_NAME: thaufilm-${{ github.sha }}.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed services
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail

          deploy_backend=false
          deploy_frontend=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_backend=true
            deploy_frontend=true
            changed_files=("Manual workflow run")
          elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(
              git diff-tree \
                --no-commit-id \
                --name-only \
                --root \
                -r \
                "${GITHUB_SHA}"
            )
          else
            mapfile -t changed_files < <(
              git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}"
            )
          fi

          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              backend/*)
                deploy_backend=true
                ;;
              frontend/*)
                deploy_frontend=true
                ;;
              docker-compose.yml)
                deploy_backend=true
                deploy_frontend=true
                ;;
            esac
          done

          if [[ "${deploy_backend}" == "true" ||
                "${deploy_frontend}" == "true" ]]; then
            deploy=true
          else
            deploy=false
          fi

          {
            echo "backend=${deploy_backend}"
            echo "frontend=${deploy_frontend}"
            echo "deploy=${deploy}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Deployment selection"
            echo
            echo "- Backend: ${deploy_backend}"
            echo "- Frontend: ${deploy_frontend}"
            echo
            echo "Changed files:"
            printf -- '- `%s`\n' "${changed_files[@]}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Validate deployment configuration
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${EC2_HOST}"
          test -n "${EC2_USER}"
          [[ "${EC2_SSH_PORT}" =~ ^[0-9]+$ ]]
          (( EC2_SSH_PORT >= 1 && EC2_SSH_PORT <= 65535 ))

      - name: Create source ZIP
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_path="${RUNNER_TEMP}/${ARCHIVE_NAME}"
          git archive \
            --format=zip \
            --output="${archive_path}" \
            "${GITHUB_SHA}"

          if unzip -Z1 "${archive_path}" |
            grep -Eiq '(^|/)\.env($|\.)|(^|/).+\.(pem|key)$'; then
            echo "A secret file was found in the deployment archive." >&2
            exit 1
          fi

          unzip -t "${archive_path}" >/dev/null

      - name: Configure SSH
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${EC2_SSH_PRIVATE_KEY}"
          test -n "${EC2_KNOWN_HOSTS}"

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" |
            sed 's/\r$//' >"${HOME}/.ssh/ec2_deploy_key"
          printf '%s\n' "${EC2_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 0600 \
            "${HOME}/.ssh/ec2_deploy_key" \
            "${HOME}/.ssh/known_hosts"

          ssh-keygen -y -f "${HOME}/.ssh/ec2_deploy_key" >/dev/null

      - name: Upload source ZIP
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -P "${EC2_SSH_PORT}" \
            -i "${HOME}/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "${RUNNER_TEMP}/${ARCHIVE_NAME}" \
            "${EC2_USER}@${EC2_HOST}:/tmp/${ARCHIVE_NAME}"

      - name: Rebuild and restart changed services on EC2
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "${EC2_SSH_PORT}" \
            -i "${HOME}/.ssh/ec2_deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o TCPKeepAlive=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s -- '${GITHUB_SHA}' \
              '${{ steps.changes.outputs.backend }}' \
              '${{ steps.changes.outputs.frontend }}'" \
            < .github/scripts/deploy-ec2.sh
